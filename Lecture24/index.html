<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="form-container">
        <h1>Student Registration Form</h1>
        <form>
            <label for="first">User Name:</label>
            <input type="text" id="first" name="Name" placeholder="Enter your first name">

            <label for="second">Last Name:</label>
            <input type="text" id="second" name="lastname" placeholder="Enter your last name">

            <label for="third">Age:</label>
            <input type="number" id="third" name="age" placeholder="Enter your age">

            <button type="submit">Submit</button>
            <!-- <button type="reset">Reset</button> -->
        </form>
     </div>
     
     <script src="first.js"></script>

     <div id="result"></div>
</body>
</html>
