<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors - Random</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🪨📄✂️ Rock Paper Scissors</h1>

    <button class="play-btn" id="play-btn">Play Random Game</button>

    <div id="choices-card">
      <p id="player1-choice">Player 1: ?</p>
      <p id="player2-choice">Player 2: ?</p>
    </div>

    <div id="result-card">
      <h2 id="winner">Winner: ?</h2>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
